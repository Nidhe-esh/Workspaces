<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Workspaces hero banner">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#heroBg)"/>
  <rect x="10" y="10" width="1180" height="360" rx="22" fill="none" stroke="url(#line)" stroke-width="3"/>

  <g opacity="0.18">
    <circle cx="110" cy="320" r="180" fill="#4f46e5"/>
    <circle cx="1040" cy="70" r="150" fill="#06b6d4"/>
  </g>

  <g transform="translate(64,72)">
    <rect x="0" y="0" width="104" height="104" rx="28" fill="#0f172a" stroke="#334155"/>
    <path d="M20 34 34 86 52 50 70 86 84 34" fill="none" stroke="#0b1222" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 28 34 80 52 44 70 80 84 28" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="190" y="124" fill="#f8fafc" font-size="62" font-family="Segoe UI, Inter, system-ui" font-weight="700">Workspaces</text>
  <text x="190" y="172" fill="#cbd5e1" font-size="26" font-family="Segoe UI, Inter, system-ui">
    Capture your running desktop setup and restore it in one click.
  </text>

  <g transform="translate(190,214)">
    <rect x="0" y="0" width="190" height="42" rx="12" fill="url(#chip)"/>
    <text x="18" y="27" fill="#f8fafc" font-size="19" font-family="Segoe UI, Inter, system-ui" font-weight="600">Windows 10/11</text>

    <rect x="204" y="0" width="170" height="42" rx="12" fill="#1f2937"/>
    <text x="222" y="27" fill="#e2e8f0" font-size="19" font-family="Segoe UI, Inter, system-ui">Portable EXE</text>

    <rect x="388" y="0" width="170" height="42" rx="12" fill="#1f2937"/>
    <text x="409" y="27" fill="#e2e8f0" font-size="19" font-family="Segoe UI, Inter, system-ui">Local-first</text>
  </g>
</svg>
